# Cloudflare の「GitHub から取り込み（Workers Builds）」で、このフォルダ（worker/）を自動公開する
name = "kaji23-reports"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "kaji23"
database_id = "4974a4be-68b3-4de6-bb89-786bd46cff1a"

# Workers AI（案内ダイヤルの録音の文字起こしに使う。Free プランでも1日約200分まで無料）
[ai]
binding = "AI"

[vars]
ALLOW_ORIGIN = "*"   # 独自ドメインを決めたら "https://（ドメイン）" に

[triggers]
crons = ["* * * * *", "17 4 * * *"]   # 毎分、消防本部の出動情報を8ページずつ読む（各ページはおよそ数十分に1回）／毎日、古い報告の明細を削除
