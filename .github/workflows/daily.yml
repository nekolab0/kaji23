# 収集 → 生成 → 検査 → 公開
#  - 毎朝6時台: 東京消防庁（署ページ・日次速報）＋報道
#  - 30分ごと: 報道だけ取り直してサイトを作り直す
name: daily
on:
  schedule:
    - cron: '23 21 * * *'      # UTC 21:23 = 日本時間 6:23（全部）
    - cron: '7,37 * * * *'     # 30分ごと（報道のみ）。GitHub の混雑で数時間あくことがある
  push:
    branches: [main]           # PR をマージしたらすぐ作り直して公開（受付サーバーと同じタイミングで反映）
    paths-ignore: ['data/**', 'verify/**', '**.md']
  workflow_dispatch:
    inputs:
      quick: { description: '報道だけ取り直す（受付サーバーから30分ごとに呼ばれる）', required: false, default: 'false' }
concurrency: { group: build, cancel-in-progress: false }
permissions: { contents: write, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci && npm i -g playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: 東京消防庁から収集（朝の1回だけ）
        if: github.event.schedule != '7,37 * * * *' && inputs.quick != 'true'
        run: node collector/run.mjs && cd site && python3 build.py && node verify_live.mjs
      - name: 報道から全国の火事を収集
        run: node collector/news_jp.test.mjs && node collector/news_run.mjs
      - name: 消防本部の発表を記録に足す（受付サーバーから）
        run: node collector/official_run.mjs
      - name: 受付サーバーのテスト
        run: node --no-warnings worker/test.mjs && node --no-warnings worker/official.test.mjs && node --no-warnings worker/mail.test.mjs && node --no-warnings worker/xposts.test.mjs && node --no-warnings worker/phone.test.mjs && node --no-warnings worker/push.test.mjs
      - name: 生成・検査
        env: { SITE_URL: '${{ vars.SITE_URL }}', SITE_OPERATOR: '${{ vars.SITE_OPERATOR }}', SITE_CONTACT: '${{ vars.SITE_CONTACT }}' }
        run: cd site && NODE_PATH=$(npm root -g) ./run_all.sh
      - name: データを保存
        # 作り直しの途中で main が進んでいる（PR のマージなど）と push が断られる。取り込み直して最大3回試し、
        # それでもだめならデータの保存だけ見送って公開は続ける（次の回で保存される）
        run: |
          git config user.name kaji23-bot && git config user.email bot@users.noreply.github.com
          git add data/raw verify && git commit -m "data: $(date -u +%FT%H:%M)" || true
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs -q || git rebase --abort; sleep 5; done
          echo "::warning::データの保存を見送りました（main が更新され続けたため）"; exit 0
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
