# 収集 → 生成 → 検査 → 公開
#  - 毎朝6時台: 東京消防庁（署ページ・日次速報）＋報道
#  - 30分ごと: 報道だけ取り直してサイトを作り直す
name: daily
on:
  schedule:
    - cron: '23 21 * * *'      # UTC 21:23 = 日本時間 6:23（全部）
    - cron: '7,37 0-16,19-23 * * *'   # 30分ごと（報道のみ）。GitHub の混雑で数時間あくことがある
    - cron: '7 17 * * *'               # UTC 17:37・18:07（日本時間 2:37・3:07）は GitHub Pages の公開が毎晩詰まって失敗するので外す
    - cron: '37 18 * * *'
  push:
    branches: [main]           # PR をマージしたらすぐ作り直して公開（受付サーバーと同じタイミングで反映）
    paths-ignore: ['data/**', 'verify/**', 'seo/**', '**.md']
  workflow_dispatch:
    inputs:
      quick: { description: '報道だけ取り直す（受付サーバーから30分ごとに呼ばれる）', required: false, default: 'false' }
concurrency: { group: build, cancel-in-progress: false }
permissions: { contents: write, pages: write, id-token: write, actions: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: npm ci && npm i -g playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: 東京消防庁から収集（朝の1回だけ）
        if: (github.event_name != 'schedule' || github.event.schedule == '23 21 * * *') && inputs.quick != 'true'
        run: node collector/run.mjs && cd site && python3 build.py && node verify_live.mjs
      - name: 報道から全国の火事を収集
        run: node collector/news_jp.test.mjs && node collector/news_run.mjs
      - name: 消防本部の発表を記録に足す（受付サーバーから）
        run: node collector/official_run.mjs
      - name: 受付サーバーのテスト
        run: node --no-warnings worker/test.mjs && node --no-warnings worker/official.test.mjs && node --no-warnings worker/mail.test.mjs && node --no-warnings worker/xposts.test.mjs && node --no-warnings worker/phone.test.mjs && node --no-warnings worker/push.test.mjs
      - name: 生成・検査
        env: { SITE_URL: '${{ vars.SITE_URL }}', SITE_OPERATOR: '${{ vars.SITE_OPERATOR }}', SITE_CONTACT: '${{ vars.SITE_CONTACT }}' }
        run: cd site && NODE_PATH=$(npm root -g) ./run_all.sh
      - name: 新しいページを検索エンジンに知らせる（IndexNow）
        run: node collector/indexnow.mjs || true
      - name: データを保存
        # 作り直しの途中で main が進んでいる（PR のマージなど）と push が断られる。取り込み直して最大3回試し、
        # それでもだめならデータの保存だけ見送って公開は続ける（次の回で保存される）
        run: |
          git config user.name kaji23-bot && git config user.email bot@users.noreply.github.com
          git add data/raw verify && git commit -m "data: $(date -u +%FT%H:%M)" || true
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs -q || git rebase --abort; sleep 5; done
          echo "::warning::データの保存を見送りました（main が更新され続けたため）"; exit 0
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      # GitHub Pages 側の混雑で公開が「順番待ち」のまま止まることがある（11/6・11/7 の 18:07 UTC の回）。
      # 5分で打ち切って1分おいてもう1回。それでもだめなら、直近3時間に公開できていればエラーにしない（30分後の回で公開される）
      - id: d1
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with: { timeout: 300000 }
      - if: steps.d1.outcome == 'failure'
        run: sleep 60
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with: { timeout: 300000 }
      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily.yml --status success --limit 1 --json updatedAt -q '.[0].updatedAt')
          echo "最後に成功した回: $last"
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 10800 ]; then
            echo "::warning::GitHub Pages の公開が2回とも失敗しました（GitHub 側の一時的な不調）。直近3時間以内に公開できているので、次の回に任せます"
          else
            echo "::error::GitHub Pages の公開が3時間以上できていません"; exit 1
          fi
