# Search Console のデータを毎日取って seo/gsc/api/ に保存する（SEO担当が読む）。続けて自動改善の数字（ops/metrics/）をまとめる
# 必要：リポジトリの Secrets に GSC_KEY（サービスアカウントの鍵 JSON）
name: gsc
on:
  schedule:
    - cron: '41 22 * * *'      # UTC 22:41 = 日本時間 7:41
  workflow_dispatch:
    inputs:
      inspect: { description: 'URL検査の件数（空なら1500）', required: false, default: '' }
concurrency: { group: gsc, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install google-auth requests
      - name: Search Console から取得
        env:
          GSC_KEY: ${{ secrets.GSC_KEY }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          SITE_URL: ${{ vars.SITE_URL }}
          INSPECT_PER_DAY: ${{ inputs.inspect }}
        run: python3 seo/fetch_gsc.py
      - name: アクセス解析（Cloudflare Web Analytics。設定がなければ飛ばす）
        continue-on-error: true
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ vars.CF_SITE_TAG }}
        run: python3 ops/fetch_cf_analytics.py
      - name: 自動改善の数字をまとめる（ops/metrics/。docs/goals.md）
        continue-on-error: true
        run: python3 ops/metrics.py
      - name: 保存
        # 30分ごとのデータ保存と重なると push が断られるので、取り込み直して最大5回試す
        run: |
          git config user.name kaji23-bot && git config user.email bot@users.noreply.github.com
          git add seo/gsc/api ops/metrics; if [ -d ops/analytics ]; then git add ops/analytics; fi; git commit -m "gsc: $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git push && exit 0; git pull --rebase -q || git rebase --abort; sleep 10; done
          echo "::warning::Search Console データの保存に失敗しました"; exit 1
