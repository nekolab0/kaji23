# 調査用: 消防の出動情報ページとオープンデータの候補を洗い出す（probe/ で始まるブランチに push すると走る）
# 結果は verify/probe_*.json として同じブランチに保存する。本番の公開には影響しない。
name: probe
on:
  push:
    branches: ['probe/**']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 過去の発表をさかのぼる
        if: ${{ contains(github.ref_name, 'backfill') }}
        run: node collector/backfill.mjs || true
      - name: 消防の出動情報ページ
        if: ${{ !contains(github.ref_name, 'opendata') && !contains(github.ref_name, 'backfill') && !contains(github.ref_name, 'news') }}
        run: node collector/probe_sources.mjs || true
      - name: オープンデータ
        if: ${{ !contains(github.ref_name, 'sources') && !contains(github.ref_name, 'backfill') && !contains(github.ref_name, 'news') }}
        run: node collector/probe_opendata.mjs || true
      - name: 報道の取り込み漏れ
        if: ${{ contains(github.ref_name, 'news') }}
        run: node collector/probe_news.mjs || true
      - name: 結果を保存
        run: |
          git config user.name kaji23-bot && git config user.email bot@users.noreply.github.com
          git add -f verify/probe_*.json verify/backfill_*.json && git commit -m "probe: $(date -u +%FT%H:%M) [skip ci]" || true
          git push
