# サイレン報告の受付サーバー（Cloudflare Workers + D1）を公開する
# 必要な Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, REPORT_SALT
# 初回はデータベースを作り、公開先URLを worker/url.txt に書いて保存する（サイト生成がこれを読む）
name: worker
on:
  push: { paths: ['worker/**', '.github/workflows/worker.yml'] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: build, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 動作テスト
        run: node --no-warnings test.mjs
      - name: キーの確認
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Settings → Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください"; exit 1; }
      - name: データベース（D1）を用意
        run: |
          ID=$(npx -y wrangler@3 d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));const d=l.find(x=>x.name==='kaji23');process.stdout.write(d?d.uuid:'')")
          if [ -z "$ID" ]; then
            npx -y wrangler@3 d1 create kaji23
            ID=$(npx -y wrangler@3 d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(l.find(x=>x.name==='kaji23').uuid)")
          fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          npx -y wrangler@3 d1 execute kaji23 --remote --file=schema.sql
      - name: 公開
        run: |
          npx -y wrangler@3 deploy --var ALLOW_ORIGIN:"${{ vars.SITE_URL || '*' }}" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::公開先URLを取得できません。Cloudflareの「Workers & Pages」を一度開いて workers.dev のサブドメインを登録してください"; exit 1; }
          [ -n "${{ secrets.REPORT_SALT }}" ] && echo "${{ secrets.REPORT_SALT }}" | npx -y wrangler@3 secret put SALT
          curl -sf "$URL/api/reports?hours=1" >/dev/null && echo "動作確認OK: $URL"
          echo "$URL" > url.txt
      - name: 公開先URLを保存
        run: |
          git config user.name kaji23-bot && git config user.email bot@users.noreply.github.com
          git add url.txt wrangler.toml && git commit -m "worker: $(cat url.txt)" && git push || true
